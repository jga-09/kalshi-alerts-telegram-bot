name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kalshi
          POSTGRES_PASSWORD: kalshi
          POSTGRES_DB: kalshi_ai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalshi" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (SQLite)
        run: pytest -q tests
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://kalshi:kalshi@localhost:5432/kalshi_ai_test
        run: pytest -q tests
      - name: Migrations apply cleanly and match models
        env:
          DATABASE_URL: postgresql+asyncpg://kalshi:kalshi@localhost:5432/kalshi_ai_test
        run: |
          psql postgresql://kalshi:kalshi@localhost:5432/kalshi_ai_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini check
          alembic -c backend/alembic.ini downgrade base
      - name: Dependency vulnerability scan
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/backend.Dockerfile -t kalshi-ai-backend .
      - run: docker build -f docker/frontend.Dockerfile -t kalshi-ai-frontend .
